
services:
  frontend:
    build: ./frontend
    ports:
      - "8500:8500"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8501:8000"
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CORS_ORIGINS=http://localhost:8500
    volumes:
      - ./backend:/app
      - ./backend/templates:/app/templates
      - ./backend/workspaces:/app/workspaces
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload